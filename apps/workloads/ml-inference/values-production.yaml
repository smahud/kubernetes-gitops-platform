# ML Inference values for production
replicaCount: 2

image:
  repository: ghcr.io/smahud/llm-inference-runtime
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    nvidia.com/gpu: 4
    cpu: "32"
    memory: "90Gi"
  requests:
    nvidia.com/gpu: 4
    cpu: "16"
    memory: "80Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

env:
  - name: MODEL
    value: "meta-llama/Meta-Llama-3-70B-Instruct"
  - name: TENSOR_PARALLEL_SIZE
    value: "4"
  - name: PIPELINE_PARALLEL_SIZE
    value: "1"
  - name: MAX_BATCH_SIZE
    value: "256"
  - name: MAX_SEQ_LEN
    value: "8192"
  - name: MAX_NUM_SEQS
    value: "256"
  - name: GPU_MEMORY_UTILIZATION
    value: "0.9"
  - name: SWAP_SPACE
    value: "4"
  - name: DTYPE
    value: "auto"
  - name: QUANTIZATION
    value: "none"
  - name: TRUST_REMOTE_CODE
    value: "false"
  - name: ENABLE_CHUNKED_PREFILL
    value: "true"
  - name: ENABLE_PREFIX_CACHING
    value: "true"
  - name: PORT
    value: "8000"
  - name: WORKERS
    value: "1"
  - name: LOG_LEVEL
    value: "info"
  - name: METRICS_ENABLED
    value: "true"
  - name: API_KEYS
    valueFrom:
      secretKeyRef:
        name: ml-inference-secrets
        key: api-keys
        optional: true
  - name: RATE_LIMIT_RPM
    value: "1000"
  - name: RATE_LIMIT_TPM
    value: "100000"
  - name: REDIS_URL
    value: "redis://llm-inference-redis:6379"
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: ml-inference-secrets
        key: hf-token
        optional: true
  - name: HF_HOME
    value: "/root/.cache/huggingface"

volumeMounts:
  - name: hf-cache
    mountPath: /root/.cache/huggingface

volumes:
  - name: hf-cache
    persistentVolumeClaim:
      claimName: hf-cache-pvc

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 180
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8000
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 30

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

nodeSelector:
  accelerator: nvidia-gpu

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

priorityClassName: high-priority