# Redis values for production
architecture: replication

auth:
  enabled: true
  existingSecret: redis-credentials
  existingSecretPasswordKey: redis-password

master:
  replicaCount: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-storage

replica:
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-storage

sentinel:
  enabled: true
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring

networkPolicy:
  enabled: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9121"